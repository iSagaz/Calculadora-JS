<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo Sagaz | Calculadora</title>
    <link rel="stylesheet" href="css/calculadora.css">
</head>

<body>
    <h1>Calculadora</h1>
    <input id="n1" type="number" placeholder="Número 1">
    <input id="n2" type="number" placeholder="Número 2">

    <div class="botões">
        <button id="somar">+</button>
        <button id="subtrair">-</button>
        <button id="multiplicar">X</button>
        <button id="dividir">÷</button>
    </div>

    <p id="resultado">Resultado: </p>

    <script src="js/calculadora.js"></script>
</body>

</html>
